<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640" role="img" aria-label="Leonardo Galli — Full-Stack Developer, IoT Developer, Low-Level &amp; Systems Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#0f1c2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="640" fill="url(#bg)"/>
  <rect width="1920" height="640" fill="url(#grid)" opacity="0.55"/>
  <rect width="1920" height="640" fill="url(#glow1)"/>
  <rect width="1920" height="640" fill="url(#glow2)"/>

  <rect x="0" y="0" width="1920" height="6" fill="#0ea5e9"/>

  <text x="960" y="240" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="34" letter-spacing="14" fill="#38bdf8">&gt; ciao, sono</text>

  <text x="960" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="6" fill="#e6edf3">Leonardo Galli</text>

  <text x="960" y="436" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" fill="#8b949e">Full-Stack Developer · IoT &amp; Embedded · Low-Level Systems</text>

  <text x="960" y="492" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="24" letter-spacing="8" fill="#6e7681">ITALY · 17 YEARS OLD · REFEREE &amp; CODER</text>

  <rect x="880" y="544" width="160" height="4" fill="#0ea5e9"/>
