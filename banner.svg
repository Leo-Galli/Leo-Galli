<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640" role="img" aria-label="Leonardo Galli — Full-Stack Developer, IoT Developer, Low-Level &amp; Systems Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1c2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#22d3ee;#818cf8;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#818cf8;#38bdf8;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#22d3ee;#818cf8;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#0ea5e9">
        <animate attributeName="stop-opacity" values="0.28;0.45;0.28" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="640" fill="url(#bg)"/>
  <rect width="1920" height="640" fill="url(#grid)" opacity="0.55"/>
  <rect width="1920" height="640" fill="url(#glow)"/>

  <rect x="0" y="0" width="1920" height="6" fill="url(#accent)"/>
  <rect x="0" y="634" width="1920" height="6" fill="url(#accent)"/>

  <text x="960" y="240" text-anchor="middle" textLength="540" lengthAdjust="spacing" font-family="'Fira Code', Consolas, monospace" font-size="34" letter-spacing="10" fill="#38bdf8">&gt; hi, i'm</text>
  <rect x="1248" y="202" width="22" height="40" fill="#7dd3fc">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="960" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="6" fill="url(#nameGrad)">Leonardo Galli</text>

  <text x="960" y="436" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" fill="#8b949e">
    Full-Stack Developer · IoT &amp; Embedded · Low-Level Systems
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <text x="960" y="492" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="24" letter-spacing="8" fill="#6e7681">ITALY · 17 Y.O. · REFEREE &amp; CODER</text>

  <circle cx="400" cy="560" r="4" fill="#38bdf8">
    <animate attributeName="cy" values="620;120" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1520" cy="520" r="3" fill="#22d3ee">
    <animate attributeName="cy" values="600;100" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1700" cy="300" r="3" fill="#818cf8">
    <animate attributeName="cy" values="640;140" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
